[package]
name = "disklens"
version.workspace = true
description = "DiskLens: a modern disk usage analyzer"
edition.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "disklens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
disklens-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-clipboard-manager = "2.4.2"
trash = "5.2.9"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
