[package]
name = "disklens-core"
version.workspace = true
edition.workspace = true
description = "Scanning, treemap and duplicate-detection engine for DiskLens"

[dependencies]
blake3 = "1.8.7"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_Vhd", "Win32_System_Power", "Win32_System_Threading"] }

[dev-dependencies]
png = "0.18.1"
