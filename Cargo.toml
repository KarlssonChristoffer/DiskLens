[workspace]
members = ["crates/core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The scanner, treemap renderer and their dependencies (rayon, blake3) are hot
# loops; optimise them even in dev builds so `tauri dev` stays representative.
[profile.dev.package.disklens-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
